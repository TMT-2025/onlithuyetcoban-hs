<!--
  Đây là bản sao mã nguồn của widget "Bảng chọn khối lớp / học kì" đã hiển thị
  trong cuộc trò chuyện (được tạo bằng tool visualize:show_widget của Claude).

  Widget này chạy trong môi trường trò chuyện của Claude (claude.ai) và dùng
  hàm toàn cục sendPrompt(text) do Claude cung cấp để gửi một tin nhắn (prompt)
  quay lại cuộc trò chuyện khi người dùng bấm nút. Khi nhận được prompt đó,
  Claude sẽ chạy các script trong các thư mục hoa10-hk1 / hoa11-hk1 / hoa12-hk1
  (hoặc script tương ứng cho học kì khác) để biên soạn nội dung và xuất file .docx.

  Nếu muốn dùng lại HTML này bên ngoài claude.ai, cần tự viết hàm sendPrompt(text)
  (ví dụ: gọi API của bạn, hoặc thay bằng điều hướng tới trang xử lý riêng).
-->
